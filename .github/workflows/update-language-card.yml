name: Update language card

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_language_card.py"
      - ".github/workflows/update-language-card.yml"

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate language card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_language_card.py
      - name: Commit updated card
        run: |
          git diff --quiet || (git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add assets/top-languages.svg && git commit -m "chore: update language card" && git push)
